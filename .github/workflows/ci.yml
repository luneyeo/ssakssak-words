name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 PR에 새 커밋이 푸시되면 이전 실행을 취소한다. main은 커밋마다 결과를 남기도록 따로 묶는다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # PR 코드가 토큰으로 저장소를 조작하지 못하도록 자격 증명을 남기지 않는다.
          persist-credentials: false

      # pnpm 버전을 여기에도 적으면 package.json의 packageManager와 어긋나 실패하므로 적지 않는다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Format check
        id: format
        continue-on-error: true
        run: pnpm format:check

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm test

      # 환경 변수가 없으면 mock으로 동작하므로 빌드에 API 키가 필요 없다.
      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build

      # next build가 만드는 라우트 타입(.next/types)까지 검사하도록 Build 뒤에 실행한다.
      - name: Type check
        id: type
        continue-on-error: true
        run: pnpm typecheck

      - name: Comment result on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # 포크와 Dependabot PR은 댓글 권한이 없어, 실패해도 검사 결과에 영향을 주지 않게 한다.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- ci-result -->';
            const icon = (o) =>
              o === 'success' ? '✅ 통과' : o === 'failure' ? '❌ 실패' : '⏭️ 실행 안 됨';
            const body = [
              marker,
              '## CI 결과',
              '',
              '| 검사 | 결과 |',
              '| --- | --- |',
              `| Lint | ${icon('${{ steps.lint.outcome }}')} |`,
              `| Format | ${icon('${{ steps.format.outcome }}')} |`,
              `| Test | ${icon('${{ steps.test.outcome }}')} |`,
              `| Type check | ${icon('${{ steps.type.outcome }}')} |`,
              `| Build | ${icon('${{ steps.build.outcome }}')} |`,
              '',
              `자세한 로그: [워크플로 실행 보기](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if any check failed
        if: >-
          steps.lint.outcome != 'success' ||
          steps.format.outcome != 'success' ||
          steps.test.outcome != 'success' ||
          steps.type.outcome != 'success' ||
          steps.build.outcome != 'success'
        run: exit 1
